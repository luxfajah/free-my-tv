<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SmartTube Glass — Preview tvOS 26 Liquid Glass + SF Symbols</title>
<style>
  :root {
    --bg: #08090D;
    --ink: #F5F5F7;
    --ink-2: rgba(235, 235, 245, 0.70);
    --ink-3: rgba(235, 235, 245, 0.45);
    --glass-fill: rgba(22, 24, 30, 0.46);
    --glass-border: rgba(255, 255, 255, 0.18);
    --glass-border-hi: rgba(255, 255, 255, 0.36);
    --white-pill: #F5F5F7;
    --white-ink: #0B0C10;
    --yt-red: #FF1E3C;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html, body {
    width: 100%; height: 100%;
    background: #030406;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", system-ui, sans-serif;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }

  #stage-wrap {
    width: 1920px; height: 1080px;
    position: relative;
    overflow: hidden;
    background: var(--bg);
    border-radius: 18px;
    box-shadow: 0 30px 110px rgba(0,0,0,0.85), 0 0 0 1px rgba(255,255,255,0.08);
    transform-origin: center center;
  }

  #backdrop-a, #backdrop-b {
    position: absolute; inset: 0;
    background-size: cover; background-position: center 25%;
    transition: opacity 0.55s cubic-bezier(.22,1,.36,1), transform 0.8s cubic-bezier(.22,1,.36,1);
    transform: scale(1.03);
  }
  #backdrop-b { opacity: 0; }

  .hero-scrim-left {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(90deg,
      rgba(8,9,13,0.92) 0%,
      rgba(8,9,13,0.68) 32%,
      rgba(8,9,13,0.18) 62%,
      rgba(8,9,13,0.0) 100%);
  }
  .hero-scrim-bottom {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg,
      rgba(8,9,13,0.62) 0%,
      rgba(8,9,13,0.12) 18%,
      rgba(8,9,13,0.04) 36%,
      rgba(8,9,13,0.45) 54%,
      rgba(8,9,13,0.90) 68%,
      rgba(8,9,13,0.99) 80%,
      rgba(8,9,13,1.0) 100%);
  }

  /* YTXTube-style Liquid Glass Surface */
  .liquid-glass {
    background:
      linear-gradient(180deg, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0.02) 48%, rgba(0,0,0,0.12) 100%),
      var(--glass-fill);
    backdrop-filter: blur(28px) saturate(185%);
    -webkit-backdrop-filter: blur(28px) saturate(185%);
    border: 1px solid var(--glass-border);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.28),
      inset 0 -1px 0 rgba(0,0,0,0.22),
      0 14px 36px rgba(0,0,0,0.42);
  }

  /* Ultra-Clean Floating Liquid Glass Top Bar */
  .top-bar {
    position: absolute; top: 38px; left: 72px; right: 72px; z-index: 30;
    display: flex; align-items: center; justify-content: space-between;
  }
  .nav-capsule {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 8px;
    border-radius: 999px;
  }
  .nav-tab {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    padding: 11px 24px;
    border-radius: 999px;
    font-size: 20px; font-weight: 600; letter-spacing: -0.01em;
    color: var(--ink-2);
    cursor: pointer;
    transition: all 0.22s cubic-bezier(.22,1,.36,1);
    border: 1px solid transparent;
  }
  .nav-tab.icon-only {
    width: 48px; height: 48px; padding: 0;
  }
  .nav-tab img {
    width: 21px; height: 21px; object-fit: contain;
    opacity: 0.80;
    transition: all 0.22s ease;
  }
  .nav-tab.selected {
    background: rgba(255,255,255,0.16);
    color: var(--ink);
    border-color: rgba(255,255,255,0.14);
  }
  .nav-tab.selected img { opacity: 1; }
  .nav-tab.focused, .nav-tab:hover {
    background: var(--white-pill);
    color: var(--white-ink);
    transform: scale(1.05);
    box-shadow: 0 8px 24px rgba(0,0,0,0.38);
  }
  .nav-tab.focused img, .nav-tab:hover img {
    filter: invert(1) brightness(0.1);
    opacity: 1;
  }

  /* Single Circular Logged-in Profile Avatar */
  .profile-orb {
    width: 58px; height: 58px;
    border-radius: 50%;
    padding: 3px;
    cursor: pointer;
    transition: all 0.22s cubic-bezier(.22,1,.36,1);
    display: flex; align-items: center; justify-content: center;
  }
  .profile-orb:hover {
    transform: scale(1.1);
    border-color: rgba(255,255,255,0.88);
    box-shadow: 0 12px 30px rgba(0,0,0,0.55), 0 0 0 2px rgba(255,255,255,0.7);
  }
  .profile-avatar {
    width: 100%; height: 100%;
    border-radius: 50%;
    object-fit: cover;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #2C3142 0%, #171A24 100%);
    color: #fff; font-size: 20px; font-weight: 700;
  }

  #content {
    position: absolute; inset: 0;
    transition: transform 0.38s cubic-bezier(.22,1,.36,1), opacity 0.25s ease;
  }
  #content.hidden { opacity: 0; pointer-events: none; }

  /* Cinema Hero Section */
  .hero {
    position: absolute; top: 140px; left: 72px; right: 72px;
    height: 410px;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding-bottom: 26px;
    z-index: 10;
  }
  .hero-badges {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 16px;
  }
  .glass-badge {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 14px; border-radius: 999px;
    font-size: 15px; font-weight: 700; letter-spacing: 0.03em;
    color: var(--ink);
  }
  .glass-badge.live {
    background: rgba(255, 30, 60, 0.85);
    border: 1px solid rgba(255,255,255,0.28);
  }
  .glass-badge img { width: 15px; height: 15px; }
  .hero-meta-inline {
    font-size: 19px; font-weight: 500; color: var(--ink-2);
  }
  .hero-title {
    font-size: 54px; font-weight: 700; line-height: 1.08;
    letter-spacing: -0.025em;
    max-width: 1060px;
    text-shadow: 0 8px 28px rgba(0,0,0,0.65);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    margin-bottom: 14px;
  }
  .hero-channel {
    display: flex; align-items: center; gap: 14px;
    font-size: 21px; font-weight: 600; color: rgba(245,245,247,0.88);
  }
  .channel-avatar {
    width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; font-weight: 700; color: #fff;
    border: 1.5px solid rgba(255,255,255,0.28);
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
  }
  .hero-actions {
    display: flex; align-items: center; gap: 14px;
    margin-top: 22px;
  }
  .hero-btn {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 13px 26px; border-radius: 999px;
    font-size: 19px; font-weight: 600;
    cursor: pointer; transition: all 0.2s cubic-bezier(.22,1,.36,1);
    border: 1px solid transparent;
  }
  .hero-btn img { width: 20px; height: 20px; }
  .hero-btn.primary {
    background: var(--white-pill); color: var(--white-ink);
    box-shadow: 0 12px 30px rgba(0,0,0,0.45);
  }
  .hero-btn.primary img { filter: invert(1) brightness(0.1); }
  .hero-btn.primary:hover { transform: scale(1.05); }
  .hero-btn.secondary { color: var(--ink); }
  .hero-btn.secondary:hover {
    background: rgba(255,255,255,0.22);
    border-color: var(--glass-border-hi);
    transform: scale(1.04);
  }

  .rows {
    position: absolute; top: 565px; left: 0; right: 0;
    display: flex; flex-direction: column; gap: 38px;
    padding-bottom: 120px;
    z-index: 12;
  }
  .row-section { padding: 0 72px; }
  .row-header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .row-title { font-size: 26px; font-weight: 700; letter-spacing: -0.015em; color: var(--ink); }
  .cards-track { display: flex; gap: 28px; }

  .v-card { width: 392px; flex-shrink: 0; cursor: pointer; outline: none; }
  .v-thumb-wrap {
    position: relative; width: 392px; height: 220px;
    border-radius: 16px; overflow: hidden;
    background: #16181F;
    border: 1px solid rgba(255,255,255,0.10);
    transition: all 0.22s cubic-bezier(.22,1,.36,1);
    box-shadow: 0 10px 26px rgba(0,0,0,0.38);
  }
  .v-thumb { width: 100%; height: 100%; object-fit: cover; display: block; }
  .v-card.focused .v-thumb-wrap, .v-card:hover .v-thumb-wrap {
    transform: scale(1.065);
    border: 2px solid rgba(255,255,255,0.88);
    box-shadow: 0 24px 54px rgba(0,0,0,0.72), 0 0 0 1px rgba(255,255,255,0.25);
  }
  .v-badge {
    position: absolute; right: 12px; bottom: 12px;
    padding: 4px 10px; border-radius: 8px;
    font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums;
    background: rgba(12, 13, 18, 0.72);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.16);
    color: #fff;
  }
  .v-badge.live { background: rgba(255, 30, 60, 0.90); border-color: rgba(255,255,255,0.28); }
  .v-progress { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: rgba(255,255,255,0.22); }
  .v-progress-fill { height: 100%; background: var(--yt-red); border-radius: 0 3px 3px 0; }
  .v-info { margin-top: 14px; padding: 0 4px; }
  .v-title {
    font-size: 19px; font-weight: 600; line-height: 1.25;
    color: rgba(245,245,247,0.86);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .v-card.focused .v-title, .v-card:hover .v-title { color: #FFFFFF; }
  .v-meta { margin-top: 5px; font-size: 16px; font-weight: 500; color: var(--ink-2); }

  /* BIBLIOTECA HUB VIEW (Histórico, Playlists, Shorts, Canais, Ajustes) */
  #library-view {
    position: absolute; inset: 0; z-index: 15;
    padding: 156px 72px 72px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease;
  }
  #library-view.open { opacity: 1; pointer-events: auto; }
  .lib-heading { font-size: 42px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 30px; }
  .lib-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px;
    max-width: 1420px;
  }
  .lib-tile {
    border-radius: 26px; padding: 30px 32px;
    display: flex; align-items: center; gap: 22px;
    cursor: pointer; transition: all 0.22s cubic-bezier(.22,1,.36,1);
  }
  .lib-tile-icon {
    width: 62px; height: 62px; border-radius: 18px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.18);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .lib-tile-icon img { width: 30px; height: 30px; object-fit: contain; }
  .lib-tile-title { font-size: 24px; font-weight: 700; color: var(--ink); }
  .lib-tile-sub { font-size: 16px; color: var(--ink-2); margin-top: 4px; }
  .lib-tile:hover {
    background: var(--white-pill);
    transform: scale(1.035);
    box-shadow: 0 24px 54px rgba(0,0,0,0.62);
  }
  .lib-tile:hover .lib-tile-title { color: var(--white-ink); }
  .lib-tile:hover .lib-tile-sub { color: rgba(11,12,16,0.62); }
  .lib-tile:hover .lib-tile-icon { background: rgba(11,12,16,0.08); border-color: rgba(11,12,16,0.12); }
  .lib-tile:hover .lib-tile-icon img { filter: invert(1) brightness(0.1); }

  /* LIQUID GLASS PLAYER OSD OVERLAY */
  #player-overlay {
    position: absolute; inset: 0; z-index: 60;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s cubic-bezier(.22,1,.36,1);
    background: #000;
  }
  #player-overlay.open { opacity: 1; pointer-events: auto; }
  #player-video-bg { position: absolute; inset: 0; background-size: cover; background-position: center; filter: brightness(0.86); }
  .player-scrim {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(8,9,13,0.62) 0%, rgba(8,9,13,0.0) 26%, rgba(8,9,13,0.0) 56%, rgba(8,9,13,0.88) 100%);
  }
  .player-top { position: absolute; top: 44px; left: 72px; right: 72px; display: flex; align-items: center; justify-content: space-between; }
  .player-top-pill { display: inline-flex; align-items: center; gap: 12px; padding: 12px 22px; border-radius: 999px; font-size: 18px; font-weight: 600; color: var(--ink); }
  .player-top-pill img { width: 20px; height: 20px; }
  .player-close-btn { cursor: pointer; transition: all 0.2s ease; }
  .player-close-btn:hover { background: var(--white-pill); color: var(--white-ink); }

  .player-dock-wrap { position: absolute; left: 72px; right: 72px; bottom: 52px; display: flex; flex-direction: column; gap: 22px; }
  .player-title-block { padding: 0 10px; }
  .player-title { font-size: 40px; font-weight: 700; letter-spacing: -0.02em; text-shadow: 0 4px 18px rgba(0,0,0,0.6); }
  .player-author { margin-top: 6px; font-size: 21px; font-weight: 500; color: var(--ink-2); }

  .player-glass-dock { border-radius: 30px; padding: 24px 32px 22px; display: flex; flex-direction: column; gap: 20px; }
  .scrub-row { display: flex; align-items: center; gap: 18px; }
  .time-label { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink-2); min-width: 64px; }
  .time-label.right { text-align: right; }
  .scrub-track { flex: 1; height: 8px; border-radius: 999px; background: rgba(255,255,255,0.22); position: relative; }
  .scrub-buffered { position: absolute; left: 0; top: 0; bottom: 0; width: 64%; background: rgba(255,255,255,0.26); border-radius: 999px; }
  .scrub-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 42%; background: #FFFFFF; border-radius: 999px; box-shadow: 0 0 14px rgba(255,255,255,0.65); }
  .scrub-thumb { position: absolute; left: 42%; top: 50%; width: 20px; height: 20px; border-radius: 50%; background: #FFFFFF; transform: translate(-50%, -50%); box-shadow: 0 2px 12px rgba(0,0,0,0.55); }
  .controls-row { display: flex; align-items: center; justify-content: space-between; }
  .controls-group { display: flex; align-items: center; gap: 14px; }
  .glass-orb {
    width: 58px; height: 58px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.16);
    cursor: pointer; transition: all 0.2s cubic-bezier(.22,1,.36,1);
  }
  .glass-orb img { width: 26px; height: 26px; object-fit: contain; }
  .glass-orb.primary { width: 68px; height: 68px; background: var(--white-pill); border-color: transparent; box-shadow: 0 10px 26px rgba(0,0,0,0.42); }
  .glass-orb.primary img { width: 30px; height: 30px; filter: invert(1) brightness(0.08); }
  .glass-orb:hover { background: var(--white-pill); transform: scale(1.1); }
  .glass-orb:hover img { filter: invert(1) brightness(0.08); }

  .hint-bar {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    padding: 6px 16px; border-radius: 999px;
    background: rgba(18,20,26,0.85); border: 1px solid rgba(255,255,255,0.14);
    font-size: 12px; color: rgba(255,255,255,0.7); z-index: 100;
  }
</style>
</head>
<body>
<div id="stage-wrap">
  <div id="backdrop-a"></div>
  <div id="backdrop-b"></div>
  <div class="hero-scrim-left"></div>
  <div class="hero-scrim-bottom"></div>

  <!-- ULTRA-CLEAN FLOATING LIQUID GLASS TOP BAR -->
  <header class="top-bar">
    <nav class="nav-capsule liquid-glass" id="nav-tabs"></nav>
    <div class="profile-orb liquid-glass" title="Conta logada">
      <div class="profile-avatar">L</div>
    </div>
  </header>

  <!-- HOME CONTENT -->
  <main id="content">
    <section class="hero">
      <div class="hero-badges">
        <span class="glass-badge liquid-glass" id="hero-badge"><img id="hero-badge-icon" alt="" /><span id="hero-badge-text">4K HDR · 60 FPS</span></span>
        <span class="hero-meta-inline" id="hero-meta"></span>
      </div>
      <h1 class="hero-title" id="hero-title"></h1>
      <div class="hero-channel">
        <div class="channel-avatar" id="hero-avatar">M</div>
        <span id="hero-author"></span>
      </div>
      <div class="hero-actions">
        <button class="hero-btn primary" id="hero-play" type="button"><img id="icon-hero-play" alt="" />Assistir agora</button>
        <button class="hero-btn secondary liquid-glass" type="button"><img id="icon-hero-channel" alt="" />Ir para o canal</button>
        <button class="hero-btn secondary liquid-glass" type="button"><img id="icon-hero-save" alt="" />Assistir mais tarde</button>
      </div>
    </section>

    <section class="rows" id="rows-container"></section>
  </main>

  <!-- BIBLIOTECA HUB (tudo o resto fica aqui dentro) -->
  <section id="library-view">
    <h1 class="lib-heading">Biblioteca</h1>
    <div class="lib-grid" id="lib-grid"></div>
  </section>

  <!-- LIQUID GLASS PLAYER OSD OVERLAY -->
  <div id="player-overlay">
    <div id="player-video-bg"></div>
    <div class="player-scrim"></div>
    <div class="player-top">
      <div class="player-top-pill liquid-glass">
        <img id="icon-player-hq" alt="" /> 2160p60 HDR · SponsorBlock Ativo
      </div>
      <button class="player-top-pill liquid-glass player-close-btn" id="btn-close-osd" type="button">
        ✕ Voltar (ESC)
      </button>
    </div>
    <div class="player-dock-wrap">
      <div class="player-title-block">
        <div class="player-title" id="osd-title"></div>
        <div class="player-author" id="osd-author"></div>
      </div>
      <div class="player-glass-dock liquid-glass">
        <div class="scrub-row">
          <span class="time-label">07:52</span>
          <div class="scrub-track">
            <div class="scrub-buffered"></div>
            <div class="scrub-fill"></div>
            <div class="scrub-thumb"></div>
          </div>
          <span class="time-label right" id="osd-duration">18:42</span>
        </div>
        <div class="controls-row">
          <div class="controls-group">
            <button class="glass-orb" title="Anterior"><img id="ic-prev" alt="" /></button>
            <button class="glass-orb primary" title="Pausar"><img id="ic-pause" alt="" /></button>
            <button class="glass-orb" title="Próximo"><img id="ic-next" alt="" /></button>
            <button class="glass-orb" title="Gostei"><img id="ic-up" alt="" /></button>
            <button class="glass-orb" title="Não gostei"><img id="ic-down" alt="" /></button>
            <button class="glass-orb" title="Inscrever-se"><img id="ic-sub" alt="" /></button>
          </div>
          <div class="controls-group">
            <button class="glass-orb" title="Legendas"><img id="ic-cc" alt="" /></button>
            <button class="glass-orb" title="Qualidade 4K"><img id="ic-hq" alt="" /></button>
            <button class="glass-orb" title="Velocidade"><img id="ic-speed" alt="" /></button>
            <button class="glass-orb" title="SponsorBlock"><img id="ic-sb" alt="" /></button>
            <button class="glass-orb" title="Comentários"><img id="ic-chat" alt="" /></button>
            <button class="glass-orb" title="Canal"><img id="ic-chan" alt="" /></button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

const navEl = document.getElementById('nav-tabs');
TABS.forEach((t) => {
  const btn = document.createElement('div');
  btn.className = 'nav-tab' + (t.selected ? ' selected' : '') + (t.iconOnly ? ' icon-only' : '');
  btn.innerHTML = t.iconOnly
    ? `<img src="${ICONS[t.icon] || ''}" alt="Buscar" />`
    : `<img src="${ICONS[t.icon] || ''}" alt="" /><span>${t.label}</span>`;
  btn.onclick = () => {
    document.querySelectorAll('.nav-tab').forEach(x => x.classList.remove('selected'));
    btn.classList.add('selected');
    const isLib = t.id === 'library';
    document.getElementById('library-view').classList.toggle('open', isLib);
    document.getElementById('content').classList.toggle('hidden', isLib);
  };
  navEl.appendChild(btn);
});

    <div class="lib-tile-icon"><img src="${ICONS[item.icon] || ''}" alt="" /></div>
    <div>
      <div class="lib-tile-title">${item.title}</div>
      <div class="lib-tile-sub">${item.sub}</div>
    </div>
  `;
  libGrid.appendChild(tile);
});

const rowsEl = document.getElementById('rows-container');
ROWS.forEach((row, rIdx) => {
  const sec = document.createElement('div');
  sec.className = 'row-section';
  sec.innerHTML = `<div class="row-header"><h2 class="row-title">${row.title}</h2></div>`;
  const track = document.createElement('div');
  track.className = 'cards-track';
  row.videos.forEach((v, cIdx) => {
    const card = document.createElement('div');
    card.className = 'v-card';
    card.dataset.r = rIdx; card.dataset.c = cIdx;
    card.innerHTML = `
      <div class="v-thumb-wrap">
        <img class="v-thumb" src="${v.img}" alt="" />
        <span class="v-badge ${v.live ? 'live' : ''}">${v.duration}</span>
        ${v.progress > 0 ? `<div class="v-progress"><div class="v-progress-fill" style="width:${v.progress}%"></div></div>` : ''}
      </div>
      <div class="v-info">
        <div class="v-title">${v.title}</div>
        <div class="v-meta">${v.author} · ${v.meta.split('·')[0].trim()}</div>
      </div>
    `;
    card.onmouseenter = () => focusCard(rIdx, cIdx);
    card.onclick = () => openPlayer(v);
    track.appendChild(card);
  });
  sec.appendChild(track);
  rowsEl.appendChild(sec);
});

function focusCard(r, c) {
  activeRow = Math.max(0, Math.min(ROWS.length - 1, r));
  activeCol = Math.max(0, Math.min(ROWS[activeRow].videos.length - 1, c));
  document.querySelectorAll('.v-card').forEach(el => {
    el.classList.toggle('focused', +el.dataset.r === activeRow && +el.dataset.c === activeCol);
  });
  const v = ROWS[activeRow].videos[activeCol];
  updateHero(v);
  document.getElementById('content').style.transform = activeRow === 0 ? 'translateY(0px)' : 'translateY(-320px)';
}

function updateHero(v) {
  document.getElementById('hero-title').textContent = v.title;
  document.getElementById('hero-author').textContent = v.author;
  document.getElementById('hero-meta').textContent = v.meta;
  const av = document.getElementById('hero-avatar');
  av.textContent = v.avatar; av.style.background = v.avatarColor;
  const badge = document.getElementById('hero-badge');
  badge.className = 'glass-badge liquid-glass' + (v.live ? ' live' : '');
  document.getElementById('hero-badge-text').textContent = v.badge;
  setIcon('hero-badge-icon', v.live ? 'sf_live' : 'sf_sparkles');

  const nextEl = document.getElementById(useBackdropA ? 'backdrop-b' : 'backdrop-a');
  const prevEl = document.getElementById(useBackdropA ? 'backdrop-a' : 'backdrop-b');
  nextEl.style.backgroundImage = `url('${v.img}')`;
  nextEl.style.opacity = '1';
  prevEl.style.opacity = '0';
  useBackdropA = !useBackdropA;
}

function openPlayer(v) {
  document.getElementById('player-video-bg').style.backgroundImage = `url('${v.img}')`;
  document.getElementById('osd-title').textContent = v.title;
  document.getElementById('osd-author').textContent = v.author;
  document.getElementById('osd-duration').textContent = v.live ? 'AO VIVO' : v.duration;
  document.getElementById('player-overlay').classList.add('open');
}
function closePlayer() {
  document.getElementById('player-overlay').classList.remove('open');
}

document.getElementById('hero-play').onclick = () => openPlayer(ROWS[activeRow].videos[activeCol]);
document.getElementById('btn-close-osd').onclick = closePlayer;

window.addEventListener('keydown', e => {
  const osdOpen = document.getElementById('player-overlay').classList.contains('open');
  if (e.key === 'Escape' && osdOpen) { closePlayer(); return; }
  if (osdOpen) return;
  if (e.key === 'ArrowRight') focusCard(activeRow, activeCol + 1);
  else if (e.key === 'ArrowLeft') focusCard(activeRow, activeCol - 1);
  else if (e.key === 'ArrowDown') focusCard(activeRow + 1, activeCol);
  else if (e.key === 'ArrowUp') focusCard(activeRow - 1, activeCol);
  else if (e.key === 'Enter') openPlayer(ROWS[activeRow].videos[activeCol]);
});

function fitStage() {
  const s = Math.min((window.innerWidth - 24) / 1920, (window.innerHeight - 24) / 1080);
  document.getElementById('stage-wrap').style.transform = `scale(${s})`;
}
window.addEventListener('resize', fitStage);
fitStage();
focusCard(0, 0);
</script>
</body>
</html>
