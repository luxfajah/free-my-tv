name: HY300Remote
options:
  bundleIdPrefix: com.hy300
  deploymentTarget:
    iOS: "18.0"
targets:
  HY300Remote:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hy300.remote
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "HY300 Remote"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Permite descobrir e controlar o projetor HY300Pro na sua rede Wi-Fi."
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Permite conectar e controlar o projetor HY300Pro via Bluetooth sem precisar de Wi-Fi."
        INFOPLIST_KEY_NSBonjourServices:
          - "_hy300remote._tcp"
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
