name: Build HY300Remote IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'altstore-source.json'

permissions:
  contents: write

jobs:
  build-ipa:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Stamp Version & Build Number
        run: |
          VERSION="1.0.${{ github.run_number }}"
          BUILD="${{ github.run_number }}"
          echo "APP_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "APP_BUILD=${BUILD}" >> "$GITHUB_ENV"
          sed -i '' "s/MARKETING_VERSION: \".*\"/MARKETING_VERSION: \"${VERSION}\"/" project.yml
          sed -i '' "s/CURRENT_PROJECT_VERSION: \".*\"/CURRENT_PROJECT_VERSION: \"${BUILD}\"/" project.yml

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Unsigned App
        run: |
          xcodebuild -project HY300Remote.xcodeproj \
            -scheme HY300Remote \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/HY300Remote.app Payload/
          zip -r HY300Remote.ipa Payload
          IPA_SIZE=$(stat -f%z HY300Remote.ipa)
          echo "IPA_SIZE=${IPA_SIZE}" >> "$GITHUB_ENV"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HY300Remote-iOS-IPA
          path: HY300Remote.ipa

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${APP_VERSION}"
          gh release create "${TAG}" HY300Remote.ipa \
            --title "HY300 Remote ${TAG}" \
            --notes "Build automático ${TAG} (Wi-Fi TCP + Bluetooth LE + Dock Dinâmica + OTA)." \
            --latest

      - name: Generate & Commit AltStore / SideStore Source JSON
        run: |
          python3 - <<'PYEOF'
          import datetime, json, os

          version = os.environ["APP_VERSION"]
          build = os.environ["APP_BUILD"]
          size = int(os.environ["IPA_SIZE"])
          repo = os.environ["GITHUB_REPOSITORY"]
          now_iso = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          download_url = f"https://github.com/{repo}/releases/download/v{version}/HY300Remote.ipa"
          icon_url = f"https://raw.githubusercontent.com/{repo}/main/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"

          source = {
              "name": "HY300 Remote",
              "identifier": "com.hy300.remote.source",
              "subtitle": "Controle Apple TV nativo para projetor HY300Pro (Wi-Fi + Bluetooth LE)",
              "website": f"https://github.com/{repo}",
              "iconURL": icon_url,
              "tintColor": "#2D7FF9",
              "apps": [
                  {
                      "name": "HY300 Remote",
                      "bundleIdentifier": "com.hy300.remote",
                      "developerName": "HY300Pro Cinema",
                      "subtitle": "Controle estilo Apple TV com Touchpad, Clickpad, Wi-Fi e Bluetooth LE",
                      "localizedDescription": "Controle remoto nativo em SwiftUI para projetor HY300Pro com conexão instantânea via Wi-Fi TCP e Bluetooth LE, dock dinâmica de aplicativos e limpeza de RAM.",
                      "iconURL": icon_url,
                      "tintColor": "#2D7FF9",
                      "versions": [
                          {
                              "version": version,
                              "buildVersion": build,
                              "date": now_iso,
                              "localizedDescription": f"Versão {version} — Atualização automática via GitHub Releases.",
                              "downloadURL": download_url,
                              "size": size,
                              "minOSVersion": "18.0"
                          }
                      ]
                  }
              ],
              "news": []
          }

          with open("altstore-source.json", "w", encoding="utf-8") as f:
              json.dump(source, f, indent=2, ensure_ascii=False)
              f.write("\n")
          PYEOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add altstore-source.json
          git diff --cached --quiet || git commit -m "chore: update altstore-source.json for v${APP_VERSION} [skip ci]"
          git push origin HEAD:main
