<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
</head>
<body class="bg-transparent text-[var(--foreground)] antialiased p-0 m-0 select-none">
  <div class="py-2">
    <!-- Interactive Stage: Dark Ambient Backdrop with Blurred Colorful Shapes for Glass Refraction -->
    <div
      id="stage"
      tabindex="0"
      class="relative w-full h-[350px] rounded-2xl bg-[#070A14] overflow-hidden border border-white/15 shadow-2xl flex items-center justify-between px-7 outline-none focus-visible:ring-2 focus-visible:ring-cyan-400"
    >
      <!-- Blurred Ambient Color Orbs (Positioned especially behind the right edge to highlight backdrop-blur-2xl) -->
      <div class="pointer-events-none absolute inset-0 overflow-hidden">
        <div class="absolute -right-8 top-4 w-52 h-52 rounded-full bg-cyan-400/50 blur-[55px]"></div>
        <div class="absolute right-4 bottom-2 w-56 h-56 rounded-full bg-fuchsia-500/45 blur-[65px]"></div>
        <div class="absolute right-16 top-1/3 w-44 h-44 rounded-full bg-amber-400/45 blur-[50px]"></div>
        <div class="absolute left-8 -top-8 w-60 h-60 rounded-full bg-indigo-500/25 blur-[75px]"></div>
        <div class="absolute left-1/3 -bottom-10 w-56 h-56 rounded-full bg-emerald-400/20 blur-[70px]"></div>
      </div>

      <!-- Left Column: Status Telemetry & Interactive Hints -->
      <div class="relative z-10 flex flex-col gap-3 max-w-[270px]">
        <div class="inline-flex items-center gap-2 self-start rounded-full border border-white/15 bg-white/10 px-3 py-1 text-xs font-medium text-cyan-300 backdrop-blur-md">
          <span class="h-2 w-2 rounded-full bg-cyan-400 animate-pulse"></span>
          tvOS / visionOS Liquid Glass
        </div>
        <div>
          <h3 class="text-lg font-semibold tracking-tight text-white">
            Apple Volume HUD
          </h3>
          <p class="mt-0.5 text-xs text-white/65 leading-relaxed">
            Clique em <strong class="text-white">+ / − / Mute</strong>, role o scroll do mouse, arraste a cápsula ou use as setas <strong class="text-white">↑ / ↓</strong>.
          </p>
        </div>

        <!-- Live State Readout -->
        <div class="flex flex-col gap-1.5 rounded-xl border border-white/15 bg-white/5 p-3 backdrop-blur-xl text-xs">
          <div class="flex items-center justify-between">
            <span class="text-white/60">Nível de Volume</span>
            <span id="vol-readout" class="font-mono font-semibold tabular-nums text-white">65%</span>
          </div>
          <div class="flex items-center justify-between">
            <span class="text-white/60">Estado da Cápsula</span>
            <span id="state-readout" class="font-mono font-semibold text-cyan-300">EXPANDED (56px)</span>
          </div>
          <div class="flex items-center justify-between">
            <span class="text-white/60">Auto-hide (2.5s)</span>
            <span id="timer-readout" class="font-mono tabular-nums text-white/80">Ativo</span>
          </div>
        </div>
      </div>

      <!-- Center Column: Simulated Apple TV Siri Remote (+, -, Mute) -->
      <div class="relative z-10 flex flex-col items-center gap-3">
        <div class="flex flex-col items-center gap-3 rounded-[32px] border border-white/25 bg-white/10 p-4 shadow-[0_20px_50px_rgba(0,0,0,0.55),inset_0_1px_1px_rgba(255,255,255,0.35)] backdrop-blur-2xl">
          <span class="text-[11px] font-medium uppercase tracking-wider text-white/55">
            Apple TV Remote
          </span>

          <!-- Volume Rocker (+ / -) -->
          <div class="flex flex-col overflow-hidden rounded-full border border-white/25 bg-black/45 shadow-[inset_0_1px_2px_rgba(255,255,255,0.2)]">
            <button
              id="btn-up"
              type="button"
              aria-label="Aumentar Volume"
              class="flex h-12 w-12 items-center justify-center text-xl font-light text-white transition active:scale-90 active:bg-white/25 hover:bg-white/15 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-cyan-400"
            >
              +
            </button>
            <div class="h-px w-full bg-white/15"></div>
            <button
              id="btn-down"
              type="button"
              aria-label="Diminuir Volume"
              class="flex h-12 w-12 items-center justify-center text-xl font-light text-white transition active:scale-90 active:bg-white/25 hover:bg-white/15 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-cyan-400"
            >
              −
            </button>
          </div>

          <!-- Mute Toggle Button -->
          <button
            id="btn-mute"
            type="button"
            aria-label="Silenciar"
            class="flex h-12 w-12 items-center justify-center rounded-full border border-white/25 bg-black/45 text-white transition active:scale-90 hover:bg-white/15 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-cyan-400"
          >
            <svg id="remote-mute-icon" viewBox="0 0 24 24" fill="none" class="h-5 w-5"></svg>
          </button>
        </div>
      </div>

      <!-- Right Edge: Floating Apple Liquid Glass Vertical Volume Capsule -->
      <div class="relative z-20 flex items-center justify-end w-[72px] h-full">
        <div
          id="glass-hud"
          role="slider"
          aria-label="Volume"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="65"
          style="width: 56px; height: 180px; will-change: transform, width, opacity;"
          class="relative cursor-ns-resize overflow-hidden rounded-full border border-white/30 bg-white/15 backdrop-blur-2xl shadow-[0_18px_45px_rgba(0,0,0,0.45),inset_0_1px_1.5px_rgba(255,255,255,0.6),inset_0_-1px_2px_rgba(0,0,0,0.3)]"
        >
          <!-- Pure White Fill (bg-white/90) rising from bottom to top -->
          <div
            id="glass-fill"
            style="height: 65%;"
            class="pointer-events-none absolute inset-x-0 bottom-0 bg-white/90 shadow-[0_-1px_8px_rgba(255,255,255,0.55)]"
          ></div>

          <!-- Cylindrical Specular Glass Sheen -->
          <div class="pointer-events-none absolute inset-0 rounded-full bg-gradient-to-br from-white/25 via-transparent to-black/15"></div>

          <!-- Minimalist Dynamic Speaker Icon at Base -->
          <div
            id="hud-icon-wrap"
            class="pointer-events-none absolute inset-x-0 bottom-3.5 flex items-center justify-center text-neutral-900 transition-colors duration-150"
          >
            <svg id="hud-speaker-icon" viewBox="0 0 24 24" fill="none" class="h-5 w-5"></svg>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const stage = document.getElementById("stage");
      const hud = document.getElementById("glass-hud");
      const fill = document.getElementById("glass-fill");
      const iconWrap = document.getElementById("hud-icon-wrap");
      const hudIcon = document.getElementById("hud-speaker-icon");
      const remoteMuteIcon = document.getElementById("remote-mute-icon");
      const volReadout = document.getElementById("vol-readout");
      const stateReadout = document.getElementById("state-readout");
      const timerReadout = document.getElementById("timer-readout");
      const btnUp = document.getElementById("btn-up");
      const btnDown = document.getElementById("btn-down");
      const btnMute = document.getElementById("btn-mute");

      // Logical State
      let volume = 65;
      let isMuted = false;
      let phase = "expanded"; // "idle" | "expanded" | "compact"
      let pressCount = 0;
      let overshootDir = null; // "top" | "bottom" | null
      let isDragging = false;

      let compactTimer = null;
      let hideTimer = null;
      let overshootTimer = null;

      // 60fps Framer Motion Spring Physics State (stiffness: 380, damping: 28)
      const spring = {
        width: { cur: 56, target: 56, vel: 0 },
        fill: { cur: 65, target: 65, vel: 0 },
        opacity: { cur: 1, target: 1, vel: 0 },
        scale: { cur: 1, target: 1, vel: 0 },
        x: { cur: 0, target: 0, vel: 0 },
        scaleY: { cur: 1, target: 1, vel: 0 },
        scaleX: { cur: 1, target: 1, vel: 0 },
        iconScale: { cur: 1, target: 1, vel: 0 }
      };

      function buildSpeakerSvg(level, muted) {
        const isZero = muted || level <= 0.5;
        let paths = `<path d="M11.25 4.75L6.75 8.5H3.75C3.19772 8.5 2.75 8.94772 2.75 9.5V14.5C2.75 15.0523 3.19772 15.5 3.75 15.5H6.75L11.25 19.25C11.9 19.79 12.75 19.33 12.75 18.48V5.52C12.75 4.67 11.9 4.21 11.25 4.75Z" fill="currentColor"/>`;
        if (isZero) {
          paths += `<path d="M4.25 4.25L19.75 19.75" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/>`;
        } else {
          paths += `<path d="M15.5 9.5C16.6 10.6 16.6 13.4 15.5 14.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>`;
          if (level >= 34) {
            paths += `<path d="M18 7.25C20.1 9.45 20.1 14.55 18 16.75" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>`;
          }
          if (level >= 67) {
            paths += `<path d="M20.5 5C23.6 8.3 23.6 15.7 20.5 19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>`;
          }
        }
        return paths;
      }

      function syncTargets() {
        const eff = isMuted ? 0 : volume;
        spring.fill.target = eff;

        if (phase === "idle") {
          spring.opacity.target = 0;
          spring.scale.target = 0.9;
          spring.x.target = 18;
          stateReadout.textContent = "IDLE (Oculto)";
          timerReadout.textContent = "Oculto";
        } else if (phase === "expanded") {
          spring.opacity.target = 1;
          spring.scale.target = 1;
          spring.x.target = 0;
          spring.width.target = 56;
          spring.iconScale.target = 1;
          stateReadout.textContent = "EXPANDED (56px)";
          timerReadout.textContent = "1.2s → 36px";
        } else {
          spring.opacity.target = 1;
          spring.scale.target = 1;
          spring.x.target = 0;
          spring.width.target = 36;
          spring.iconScale.target = 0.8;
          stateReadout.textContent = "COMPACT (36px)";
          timerReadout.textContent = "2.5s → Idle";
        }

        spring.scaleY.target = overshootDir ? 1.06 : 1;
        spring.scaleX.target = overshootDir ? 0.95 : 1;

        volReadout.textContent = isMuted ? "Mudo (0%)" : `${Math.round(eff)}%`;
        hud.setAttribute("aria-valuenow", String(Math.round(eff)));

        const svgHtml = buildSpeakerSvg(eff, isMuted);
        hudIcon.innerHTML = svgHtml;
        remoteMuteIcon.innerHTML = svgHtml;

        // Color inversion when white fill passes over the bottom icon (> 18%)
        if (eff > 18) {
          iconWrap.classList.remove("text-white/90");
          iconWrap.classList.add("text-neutral-900");
        } else {
          iconWrap.classList.remove("text-neutral-900");
          iconWrap.classList.add("text-white/90");
        }

        if (isMuted) {
          btnMute.className = "flex h-12 w-12 items-center justify-center rounded-full border border-white/60 bg-white/90 text-neutral-900 shadow-[0_0_20px_rgba(255,255,255,0.4)] transition active:scale-90 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-cyan-400";
        } else {
          btnMute.className = "flex h-12 w-12 items-center justify-center rounded-full border border-white/25 bg-black/45 text-white transition active:scale-90 hover:bg-white/15 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-cyan-400";
        }
      }

      function clearTimers() {
        if (compactTimer) clearTimeout(compactTimer);
        if (hideTimer) clearTimeout(hideTimer);
      }

      function scheduleTimers() {
        clearTimers();
        compactTimer = setTimeout(() => {
          if (!isDragging && phase === "expanded") {
            phase = "compact";
            syncTargets();
          }
        }, 1200);

        hideTimer = setTimeout(() => {
          if (!isDragging) {
            phase = "idle";
            pressCount = 0;
            syncTargets();
          }
        }, 2500);
      }

      function triggerOvershoot(dir) {
        if (overshootTimer) clearTimeout(overshootTimer);
        overshootDir = dir;
        hud.style.transformOrigin = dir === "top" ? "bottom center" : "top center";
        syncTargets();
        overshootTimer = setTimeout(() => {
          overshootDir = null;
          syncTargets();
        }, 170);
      }

      function adjustVolume(delta) {
        const wasIdle = phase === "idle";
        pressCount = wasIdle ? 1 : pressCount + 1;

        if (wasIdle || pressCount === 1) {
          phase = "expanded";
        } else if (pressCount >= 2) {
          phase = "compact";
        }

        if (isMuted && delta > 0) {
          isMuted = false;
        }

        const next = volume + delta;
        if (next > 100) {
          volume = 100;
          triggerOvershoot("top");
        } else if (next < 0) {
          volume = 0;
          triggerOvershoot("bottom");
        } else {
          volume = next;
          overshootDir = null;
        }

        syncTargets();
        scheduleTimers();
      }

      function toggleMute() {
        pressCount = 1;
        phase = "expanded";
        isMuted = !isMuted;
        syncTargets();
        scheduleTimers();
      }

      btnUp.addEventListener("click", () => adjustVolume(8));
      btnDown.addEventListener("click", () => adjustVolume(-8));
      btnMute.addEventListener("click", toggleMute);

      stage.addEventListener("wheel", (e) => {
        e.preventDefault();
        adjustVolume(e.deltaY < 0 ? 5 : -5);
      }, { passive: false });

      window.addEventListener("keydown", (e) => {
        if (e.key === "ArrowUp" || e.key === "+" || e.key === "=") {
          e.preventDefault();
          adjustVolume(6);
        } else if (e.key === "ArrowDown" || e.key === "-") {
          e.preventDefault();
          adjustVolume(-6);
        } else if (e.key.toLowerCase() === "m") {
          e.preventDefault();
          toggleMute();
        }
      });

      function scrubAt(clientY) {
        const rect = hud.getBoundingClientRect();
        const ratio = 1 - (clientY - rect.top) / rect.height;
        if (ratio > 1) {
          volume = 100;
          isMuted = false;
          overshootDir = "top";
          hud.style.transformOrigin = "bottom center";
        } else if (ratio < 0) {
          volume = 0;
          overshootDir = "bottom";
          hud.style.transformOrigin = "top center";
        } else {
          isMuted = false;
          overshootDir = null;
          volume = Math.round(ratio * 100);
        }
        syncTargets();
      }

      hud.addEventListener("pointerdown", (e) => {
        isDragging = true;
        hud.setPointerCapture(e.pointerId);
        phase = "expanded";
        clearTimers();
        scrubAt(e.clientY);
      });

      hud.addEventListener("pointermove", (e) => {
        if (!isDragging) return;
        scrubAt(e.clientY);
      });

      hud.addEventListener("pointerup", () => {
        isDragging = false;
        overshootDir = null;
        syncTargets();
        scheduleTimers();
      });

      // Physics Animation Loop (Damped Harmonic Oscillator)
      let lastTime = performance.now();
      function stepSpring(prop, stiffness, damping, dt) {
        const force = (prop.target - prop.cur) * stiffness - prop.vel * damping;
        prop.vel += force * dt;
        prop.cur += prop.vel * dt;
      }

      function tick(now) {
        let dt = (now - lastTime) / 1000;
        lastTime = now;
        if (dt <= 0 || dt > 0.05) dt = 0.016;

        stepSpring(spring.width, 380, 30, dt);
        stepSpring(spring.fill, 420, 32, dt);
        stepSpring(spring.opacity, 340, 30, dt);
        stepSpring(spring.scale, 360, 28, dt);
        stepSpring(spring.x, 360, 28, dt);
        stepSpring(spring.scaleY, 460, 22, dt);
        stepSpring(spring.scaleX, 460, 22, dt);
        stepSpring(spring.iconScale, 380, 28, dt);

        hud.style.width = `${spring.width.cur.toFixed(2)}px`;
        hud.style.opacity = `${Math.max(0, Math.min(1, spring.opacity.cur)).toFixed(3)}`;
        hud.style.transform = `translate3d(${spring.x.cur.toFixed(2)}px, 0, 0) scale(${(spring.scale.cur * spring.scaleX.cur).toFixed(4)}, ${(spring.scale.cur * spring.scaleY.cur).toFixed(4)})`;
        fill.style.height = `${Math.max(0, Math.min(100, spring.fill.cur)).toFixed(2)}%`;
        iconWrap.style.transform = `scale(${spring.iconScale.cur.toFixed(3)})`;

        requestAnimationFrame(tick);
      }

      syncTargets();
      scheduleTimers();
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
